<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنيو الإلكتروني | بصمة ديزاين</title><style>body{font-family:system-ui;background:#faf8f6;margin:0;color:#211}header,main{max-width:850px;margin:auto;padding:18px}header{background:white}input,button{padding:12px;border-radius:9px;border:1px solid #ddd;margin:5px}button{background:#a91d2b;color:white;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;padding:12px;border-radius:12px}.card img{max-width:100%;height:140px;object-fit:cover}.muted{color:#777}</style><header><h2 id="title">المنيو الإلكتروني من بصمة ديزاين</h2><p>نموذج تأسيسي — بعد نشر API وربط قاعدة البيانات</p><p id="social"></p></header><main><input id="slug" placeholder="رابط المطعم المختصر مثل tasa"><button id="load">عرض المنيو</button><p id="status" class="muted"></p><div id="menu" class="grid"></div><hr><h3>دخول الإدارة</h3><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><p id="loginStatus"></p><p class="muted">الدفع الإلكتروني غير مفعل حتى ربط بوابة دفع والتحقق من الدفع على الخادم.</p></main><script>const $=x=>document.getElementById(x);let token=localStorage.getItem('basma_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تنفيذ الطلب');return j}$('load').onclick=async()=>{try{let d=await api('/api/public/restaurant/'+encodeURIComponent($('slug').value.trim()));$('title').textContent=d.restaurant.name;$('social').innerHTML=[['فيسبوك',d.restaurant.facebook_url],['تيك توك',d.restaurant.tiktok_url],['الموقع',d.restaurant.maps_url],['اتصال',d.restaurant.phone?'tel:'+d.restaurant.phone:null],['واتساب',d.restaurant.whatsapp_phone?'https://wa.me/'+d.restaurant.whatsapp_phone.replace(/\D/g,''):null]].filter(x=>x[1]).map(x=>`<a href="${esc(x[1])}">${esc(x[0])}</a>`).join(' · ');$('menu').innerHTML=d.menu_products.map(p=>`<article class="card"><img src="${esc(p.image_url||'')}" onerror="this.style.display='none'"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><b>${(p.price/100).toLocaleString('ar-EG')} جنيه</b></article>`).join('');$('status').textContent='تم تحميل المنيو'}catch(e){$('status').textContent=e.message}};$('login').onclick=async()=>{try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;localStorage.setItem('basma_token',token);$('loginStatus').textContent='تم تسجيل الدخول: '+d.user.username+' ('+d.user.role+'). واجهة إدارة الأصناف الكاملة تحتاج استكمالًا.'}catch(e){$('loginStatus').textContent=e.message}};if(new URLSearchParams(location.search).get('r')){$('slug').value=new URLSearchParams(location.search).get('r');$('load').click()}</script></html>
